name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core + serve + data + hub + dev (no torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[serve,data,hub,dev]"

      - name: Import check (torch must not load)
        run: |
          python -c "import vane; import sys; assert 'torch' not in sys.modules"

      - name: Pytest without torch
        run: pytest

      - name: Install CPU torch (train extra)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[train]"

      - name: Pytest with torch
        run: pytest
