extends: base

model:
  name: vane-1.0.0-text
  modality: text
  profile: match
  match:
    d_model: 768
    n_blocks: 2
    n_heads: 12
    d_ff: 3072
    vocab_size: 256
    window_size: 128
    max_context: 8192
  backbone:
    repo: jhu-clsp/mmBERT-base
    frozen: true
    load: true
    dim: 768
  backbone_dim: 768
  n_refine: 2
  vision_proj_dim: null

training:
  epochs: 1
  max_steps: null
  batch_size: 8
  lr: 0.0001
  max_seq_len: 8192
  checkpoint_every: 500
  eval_every: 500
  device: cuda
  early_exit_train_prob: 0.25

data:
  max_examples_per_corpus: null
  two_pole_pairs: 0
  calibration_size: 2048
  calibration_fraction: 0.02
  tokenizer: backbone
  corpora:
    - AmazonScience/massive
    - clinc_oos
    - Tobi-Bueck/customer-support-tickets
    - PolyAI/banking77
    - google/boolq
    - nyu-mll/multi_nli
    - xnli
    - facebook/anli
    - fever
    - google-research-datasets/go_emotions
    - google/civil_comments
    - deepset/prompt-injections
    - lmsys/toxic-chat
    - zefang-liu/phishing-email-dataset
    - SetFit/enron_spam
    - nvidia/HelpSteer2
    - SetFit/sst5
    - microsoft/ms_marco

checkpoint:
  dir: checkpoints/vane-text-1.0.0
