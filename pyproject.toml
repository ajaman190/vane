[project]
name = "vane"
version = "0.1.0"
description = "Windowed decision model. Probabilities over typed questions."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
vane-serve = "vane.serve:main"
vane-train = "vane.train.text:main"
vane-eval = "vane.train.evaluate:main"

[project.optional-dependencies]
data = [
    "datasets>=3.0",
    "numpy>=1.26",
]
hub = [
    "huggingface_hub>=0.26",
    "safetensors>=0.4",
]
train = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "datasets>=3.0",
    "pillow>=10.0",
    "transformers>=4.48",
]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.wheel.force-include]
"src/vane/train/configs/base.yaml" = "vane/train/configs/base.yaml"
"src/vane/train/configs/vane-text-1.0.0.yaml" = "vane/train/configs/vane-text-1.0.0.yaml"
"src/vane/train/configs/vane-vision-1.0.0.yaml" = "vane/train/configs/vane-vision-1.0.0.yaml"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
